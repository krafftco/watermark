# The walk after a deploy (27 Oct): once the tests pass on main, wait for Render to put that commit live (the brief
# /healthz carries `ver`, the first eight of the commit), then open the doors of the house and read them. A fault
# mails the repository's owner by GitHub's default. A build that never arrives within forty minutes is a fault too.
# (#66, 16 Nov) A promotion pushes with the workflow's own token, which starts no `test` and so no walk; promote.yml now
# starts this walk itself (workflow_dispatch, with the promoted commit as `sha`) once `test` is green on main. A `test`
# that promote.yml dispatched is therefore not walked again from here.
name: live
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to wait for and walk (main's head when empty)
        required: false
permissions:
  contents: read
jobs:
  walk:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Wait for the commit to be live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.sha || github.sha) || github.event.workflow_run.head_sha }}
          MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          [ -n "$MSG" ] || MSG=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq .commit.message)
          want=$(echo "$SHA" | cut -c1-8)
          case "$MSG" in *"[skip render]"*|*"[render skip]"*) echo "a push Render skips: walking the house as it stands"; exit 0;; esac
          echo "waiting for $want"
          for i in $(seq 1 80); do
            got=$(curl -s https://watermark-3a4z.onrender.com/healthz | sed -n 's/.*"ver":"\([0-9a-f]*\)".*/\1/p')
            echo "$(date -u +%H:%M:%S) live: ${got:-none}"
            [ "$got" = "$want" ] && exit 0
            sleep 30
          done
          echo "::error::The commit never arrived at the origin in forty minutes."; exit 1
      - name: Let the edge clear
        run: sleep 40
      - name: Open the doors
        run: |
          fail=0
          for p in / /house /wander /library /listening /collection /makers /keys /about /healthz /api/v1 /app; do
            c=$(curl -s -o /tmp/door -w '%{http_code} %{time_total}s' "https://watermark.krafftco.com$p"); echo "$p $c"
            case "${c%% *}" in 200|301|302) ;; *) echo "::error::$p answered ${c%% *}"; fail=1;; esac
            if grep -q 'caught a cold' /tmp/door; then echo "::error::$p is the cold page (the edge answers it as 200)"; fail=1; fi
          done
          exit $fail
