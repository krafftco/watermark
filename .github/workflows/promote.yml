# The deploy window (5 Nov): one promotion a day, 06:30 New York (11:30 UTC in winter, 10:30 in summer: the
# earlier of the two is kept all year so the window never drifts past seven). `main` moves to `next` only when the
# latest `test` run on `next` is green and the house is not being shown (the brief /healthz carries `showing`).
# A push to `main` by hand outside the window is a hotfix and must say so in its message.
# (#66, 16 Nov) A push made with the workflow's own token starts no other workflow, so from 11 to 16 Nov `test` and
# `live` never ran after a promotion. The promotion now walks what it promoted: after the push it starts `test` on main
# and then `live` (workflow_dispatch, the one event that token may raise; scripts/ci-dispatch.sh), waits for each, and
# fails red with an annotation if either does. Both runs land on main at the promoted commit, so their checks show on
# that commit and in `actions/runs?branch=main`. `dry_run` does all of it but the push, on main as it stands.

name: promote
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: Why outside the window (a hotfix)
        required: false
      dry_run:
        description: Everything but the push; the checks and the walk run on main as it stands
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
      # Every job of test.yml; a promotion needs each of them green on next's own push of the commit. Rename one there,
      # rename it here.
      NEEDS: test load a11y reach reach-webkit postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Anything to promote?
        id: diff
        run: |
          git fetch origin main next
          [ -n "$DRY" ] && echo "::notice title=promote (dry run)::nothing will be pushed; the checks and the walk run on main at $(git rev-parse --short origin/main)"
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse origin/next)" ]; then echo "main is next already"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git merge-base --is-ancestor origin/main origin/next; then echo "::error::main has moved off next (a hotfix?); merge main into next first"; exit 1; fi
          echo "$(git rev-list --count origin/main..origin/next) commits waiting"
      # A dry run reports what would have stopped a promotion as a warning and goes on to the walk.
      - name: No code left beneath a [skip render]
        if: steps.diff.outputs.skip != '1'
        run: |
          fail() { if [ -n "$DRY" ]; then echo "::warning title=promote ([skip render], dry run)::$1"; exit 0; fi; echo "::error title=promote ([skip render])::$1"; exit 1; }
          skips() { case "$(git log -1 --format=%B "$1")" in *"[skip render]"*|*"[render skip]"*) return 0;; esac; return 1; }
          skips origin/next || { echo "the newest commit deploys"; exit 0; }
          code=0; for c in $(git rev-list origin/main..origin/next); do skips "$c" || code=$((code+1)); done
          [ "$code" = 0 ] && { echo "every commit waiting carries [skip render]: main moves, the host deploys nothing new"; exit 0; }
          fail "The newest commit on next ($(git rev-parse --short origin/next)) carries [skip render], so the host would skip this push and the $code commit(s) beneath it that carry code would reach main without being deployed. Nothing promoted. Land a commit on next without [skip render] (an empty one will do: git commit --allow-empty -m 'Deploy what is beneath'), let its test go green, then promote."
      - name: The tests on next are green, every job
        if: steps.diff.outputs.skip != '1'
        run: |
          fail() { if [ -n "$DRY" ]; then echo "::warning title=promote (tests on next, dry run)::$1"; exit 0; fi; echo "::error title=promote (tests on next)::$1"; exit 1; }
          sha=$(git rev-parse origin/next)
          read -r id st c < <(gh api "repos/$R/actions/workflows/test.yml/runs?branch=next&event=push&head_sha=$sha&per_page=5" --jq '[.workflow_runs[] | select(.status == "completed")][0] | "\(.id // "-") \(.status // "-") \(.conclusion // "-")"')
          echo "test on next at $sha, newest finished run: $id, $st, $c"
          [ "$id" != "-" ] || fail "no finished test run on next for ${sha:0:8}; nothing promoted"
          [ "$st" = "completed" ] && [ "$c" = "success" ] || fail "the tests on next at ${sha:0:8} are $st/$c; nothing promoted"
          jobs=$(gh api "repos/$R/actions/runs/$id/jobs?filter=latest&per_page=50" --jq '.jobs[] | "\(.name)=\(.conclusion)"'); echo "$jobs"
          for j in $NEEDS; do echo "$jobs" | grep -qx "$j=success" || fail "the job $j is not green on next at ${sha:0:8} (run $id); nothing promoted"; done
          bad=$(echo "$jobs" | grep -v '=success$' || true); [ -z "$bad" ] || fail "not green on next at ${sha:0:8}: $bad; nothing promoted"
      - name: The house is not being shown
        if: steps.diff.outputs.skip != '1'
        run: |
          s=$(curl -s https://watermark.krafftco.com/healthz | sed -n 's/.*"showing":\(true\|false\).*/\1/p')
          echo "showing: ${s:-unknown}"
          if [ "$s" = "true" ]; then
            if [ -n "$DRY" ]; then echo "::warning title=promote (dry run)::the house is being shown; a promotion would wait"; else echo "::error::the house is being shown; no deploy"; exit 1; fi
          fi
      - name: Promote
        if: steps.diff.outputs.skip != '1' && env.DRY == ''
        run: |
          git push origin origin/next:main
          echo "main is now $(git rev-parse --short origin/next)"
      # A promotion that had nothing to promote starts nothing; a dry run walks main as it stands.
      - name: Which commit is walked
        id: walk
        if: steps.diff.outputs.skip != '1' || env.DRY != ''
        run: |
          if [ -n "$DRY" ]; then sha=$(git rev-parse origin/main); else sha=$(git rev-parse origin/next); fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "walking $sha"
      - name: The checks on main, at the promoted commit
        if: steps.walk.outputs.sha != ''
        run: bash scripts/ci-dispatch.sh test.yml "${{ steps.walk.outputs.sha }}" "test on main" 45
      - name: The walk through the edge
        if: steps.walk.outputs.sha != ''
        run: bash scripts/ci-dispatch.sh live.yml "${{ steps.walk.outputs.sha }}" "live walk" 60 -f sha="${{ steps.walk.outputs.sha }}"
