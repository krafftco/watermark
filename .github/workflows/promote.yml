# The deploy window (5 Nov): one promotion a day, 06:30 New York (11:30 UTC in winter, 10:30 in summer: the
# earlier of the two is kept all year so the window never drifts past seven). `main` moves to `next` only when the
# latest `test` run on `next` is green and the house is not being shown (the brief /healthz carries `showing`).
# A push to `main` by hand outside the window is a hotfix and must say so in its message.
name: promote
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: Why outside the window (a hotfix)
        required: false
permissions:
  contents: write
  actions: read
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Anything to promote?
        id: diff
        run: |
          git fetch origin main next
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse origin/next)" ]; then echo "main is next already"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git merge-base --is-ancestor origin/main origin/next; then echo "::error::main has moved off next (a hotfix?); merge main into next first"; exit 1; fi
          echo "$(git rev-list --count origin/main..origin/next) commits waiting"
      - name: The tests on next are green
        if: steps.diff.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse origin/next)
          c=$(gh api "repos/${{ github.repository }}/actions/runs?branch=next&per_page=20" --jq ".workflow_runs[] | select(.name==\"test\" and .head_sha==\"$sha\") | .conclusion" | head -1)
          echo "test on $sha: ${c:-none}"
          [ "$c" = "success" ] || { echo "::error::the tests on next are not green ($c); nothing promoted"; exit 1; }
      - name: The house is not being shown
        if: steps.diff.outputs.skip != '1'
        run: |
          s=$(curl -s https://watermark.krafftco.com/healthz | sed -n 's/.*"showing":\(true\|false\).*/\1/p')
          echo "showing: ${s:-unknown}"
          [ "$s" = "true" ] && { echo "::error::the house is being shown; no deploy"; exit 1; } || true
      - name: Promote
        if: steps.diff.outputs.skip != '1'
        run: |
          git push origin origin/next:main
          echo "main is now $(git rev-parse --short origin/next)"
