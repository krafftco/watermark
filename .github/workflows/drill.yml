# The fire drill (29 Oct, Will: "we never can mess up; we have to be all-stars at this"). Every night, and on demand,
# a real import goes through the real doors with everything a real day throws at it (60 MP masters, near-twins, the
# same bytes twice, a truncated file, a page named .jpg, bytes changed on the way, a dropped connection, a file never
# sent), first on the house's own road and then straight into an S3 bucket in parts (moto), and the receipt must
# account for every file. A failed run mails the repository's owner (GitHub's default).
name: drill
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
  push:
    branches: [next]
    paths: ['src/arrivals.js', 'src/imports.js', 'src/images.js', 'src/bagcheck.js', 'public/arrivals.js', 'public/sha256-worker.js', 'test/drill.js', '.github/workflows/drill.yml']
jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The house's own road
        run: node test/drill.js
        env:
          DRILL_MEM_MB: '2200'
      # An S3 vault, by moto (the S3 emulator AWS's SDK teams test against; pip, no Docker: MinIO's public images
      # went behind a login in 2026 and a test that depends on someone else's registry is not a test).
      # (#31, 11–15 Nov: red every night from the pin to 24.04, "ECONNREFUSED 127.0.0.1:9000".) The step installed moto
      # into the image's system Python with `pip -q`, started `moto_server` from wherever that put it, and a wait loop that
      # fell through: moto never listened and nothing said why. Now: our own Python, moto in a venv at a pinned version,
      # started by its absolute path; the wait fails the step with moto.log as an annotation. No path skips this half.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: An S3 vault (moto)
        run: |
          set -u
          say() { echo "::error title=drill (moto)::$1: $(tail -c 1300 "$2" 2>/dev/null | sed 's/%/%25/g' | awk 1 ORS='%0A')"; }
          python -m venv /tmp/moto > /tmp/moto-install.log 2>&1 \
            && /tmp/moto/bin/pip install --disable-pip-version-check 'moto[server]==5.2.5' >> /tmp/moto-install.log 2>&1 \
            || { say "moto did not install" /tmp/moto-install.log; exit 1; }
          nohup /tmp/moto/bin/moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          pid=$!; up=0
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9000/ && { up=1; echo "moto up after ${i}s"; break; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          [ $up = 1 ] || { say "moto never answered on 127.0.0.1:9000 (process $(kill -0 $pid 2>/dev/null && echo alive || echo gone))" moto.log; exit 1; }
          set -o pipefail
          node test/drill.js 2>&1 | tee /tmp/drill-s3.txt
          grep -q 'an S3 vault: straight to the bucket in parts' /tmp/drill-s3.txt || { say "the drill did not take the S3 road" /tmp/drill-s3.txt; exit 1; }
        env:
          DRILL_S3_ENDPOINT: http://127.0.0.1:9000
          DRILL_S3_BUCKET: drill
          AWS_ACCESS_KEY_ID: drill
          AWS_SECRET_ACCESS_KEY: drill
          AWS_REGION: us-east-1
          DRILL_MEM_MB: '2200'
          DRILL_BIG: '10'
