# The gate between a push and the house (22 Oct): every push to main runs the suite; Render deploys only when it
# passes (Render → the service → Settings → "Wait for CI to pass before deploy", Will's switch).
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The tools the Dockerfile gives the house (the document kind reads PDFs with poppler and OCRs with tesseract);
      # without them the suite stops at 'poppler on the box' and the gate stays red for nothing.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr > /dev/null
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          NODE_ENV: test
