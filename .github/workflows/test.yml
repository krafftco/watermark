# The gate between a push and the house (22 Oct): every push to main or next runs the suite; Render deploys only when
# it passes (Render → the service → Settings → "Wait for CI to pass before deploy", Will's switch). Two engines
# (27 Oct): the suite runs on SQLite as it always did, and the smoke suite and the static SQL check run against a
# real Postgres, since that is what the live house will stand on.
# (#66, 16 Nov) workflow_dispatch: promote.yml starts this on main after a promotion, since its push (the workflow's own
# token) starts nothing by itself; the run's checks then show on the promoted commit.
name: test
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The tools the Dockerfile gives the house (the document kind reads PDFs with poppler and OCRs with tesseract);
      # without them the suite stops at 'poppler on the box' and the gate stays red for nothing.
      - run: bash scripts/ci-apt.sh poppler-utils tesseract-ocr lua5.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          NODE_ENV: test
  # The load test (7 Nov, docs/STABILITY.md): forty visitors over a seeded house; p95, errors, the stand-in, memory growth.
  # The runner has two cores, so the page line is looser here than on a Mac (LOAD_P95_MS 2500). An uncounted warm-up
  # (LOAD_WARM_S 8) and at least LOAD_MIN_N (80) answers a door before a p95 is read (#25).
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # (#25: the one red of 10–15 Nov, 12 Nov 17:13 on main, was this install failing in nine seconds; the load test never
      # ran and nothing said why.) The install's last lines go out as an annotation; a second try only for the install.
      - run: |
          npm ci > /tmp/npm-ci.txt 2>&1 && exit 0
          echo "::warning title=load (npm ci)::$(tail -c 1300 /tmp/npm-ci.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"
          sleep 10; npm ci > /tmp/npm-ci.txt 2>&1 && exit 0
          echo "::error title=load (npm ci)::the install failed twice; the load test did not run:%0A$(tail -c 1300 /tmp/npm-ci.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1
      # The script raises its own fault as an annotation (which budget, the numbers, the door); a crash before that, here.
      - run: |
          set -o pipefail
          node scripts/load.js 2>&1 | tee /tmp/load.txt || { grep -q '::error title=load' /tmp/load.txt || echo "::error title=load::$(tail -c 1400 /tmp/load.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1; }
        env:
          LOAD_WORKS: '24'
          LOAD_C: '20'
          LOAD_S: '25'
          LOAD_P95_MS: '2500'
          LOAD_GROW_MB: '450'   # the runner's caches fill from cold (sharp, the find index, V8); a leak shows as growth past this, not under it
  # The scale gate (#8; 9 and 13 Nov): a house of 100,000 works built from rows (seconds), every room walked once
  # as a visitor, a maker, a museum's desk and the Studio; a statement over 250 ms or 5,000 rows, a page over 1.5 s, 3 MB
  # or 300 statements fails, unless its room is in the script's ALLOW with an issue. The script raises its own faults as
  # annotations (room, budget, statement); a crash before that is raised here.
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci > /tmp/npm-ci.txt 2>&1 && exit 0
          echo "::warning title=scale (npm ci)::$(tail -c 1300 /tmp/npm-ci.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"
          sleep 10; npm ci > /tmp/npm-ci.txt 2>&1 && exit 0
          echo "::error title=scale (npm ci)::the install failed twice; the scale gate did not run:%0A$(tail -c 1300 /tmp/npm-ci.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1
      - run: |
          set -o pipefail
          node scripts/big-house.js 2>&1 | tee /tmp/scale.txt || { grep -q '::error title=scale' /tmp/scale.txt || echo "::error title=scale::$(tail -c 1400 /tmp/scale.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1; }
        env:
          BIG_TABLE: /tmp/scale-table.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-table
          path: /tmp/scale-table.md
          if-no-files-found: ignore
  # The scale gate on Postgres (#116, docs/SCALE.md stage 1 "Truth"): the same house of 100,000 works, moved into Postgres
  # 16 by scripts/to-postgres.js and walked THROUGH THE BRIDGE (src/pgsync.js) as the website does, with the same budgets
  # and its own allow-list (ALLOW_PG); the numbers desk and the digest are walked open. Live is Postgres 16 on 2 CPU and
  # 8 GB (Render, 20 Nov) with settings assumed default; the runner's server is postgres:16 with its defaults (work_mem
  # 4 MB, shared_buffers 128 MB) on a runner that is not live's size: a time here is a guide, the plan is the evidence.
  # Each statement over a line is reported with its plan (EXPLAIN ANALYZE after the walk), in an annotation and whole in
  # the `scale-postgres` artifact.
  scale-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci > /tmp/npm-ci.txt 2>&1 && exit 0
          echo "::warning title=scale-postgres (npm ci)::$(tail -c 1300 /tmp/npm-ci.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"
          sleep 10; npm ci > /tmp/npm-ci.txt 2>&1 && exit 0
          echo "::error title=scale-postgres (npm ci)::the install failed twice; the gate did not run:%0A$(tail -c 1300 /tmp/npm-ci.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1
      # Started here rather than as a service, so a wait that runs out prints the server's log. --shm-size: Docker's 64 MB
      # /dev/shm is too small for a parallel scan or VACUUM (the first run failed so); a real server has the host's.
      # max_wal_size only spares the move a checkpoint every few seconds (it does not change a plan).
      - run: |
          docker run -d --name pg --shm-size=1g -e POSTGRES_PASSWORD=wm -p 5432:5432 postgres:16 -c max_wal_size=2GB
          for i in $(seq 1 45); do docker exec pg pg_isready -U postgres -h localhost > /dev/null 2>&1 && exit 0; sleep 2; done
          echo "::error title=scale-postgres (server)::Postgres did not answer in 90 s:%0A$(docker logs pg 2>&1 | tail -c 1200 | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1
      - run: |
          set -o pipefail
          node scripts/big-house.js 2>&1 | tee /tmp/scale-pg.txt || { grep -q '::error title=scale-postgres' /tmp/scale-pg.txt || echo "::error title=scale-postgres::$(tail -c 1400 /tmp/scale-pg.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1; }
        env:
          BIG_PG: postgres://postgres:wm@localhost:5432/postgres
          BIG_TABLE: /tmp/scale-pg-table.md
          BIG_PLANS: /tmp/scale-pg-plans.md
      - if: always()
        run: docker stats --no-stream pg || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-postgres
          path: |
            /tmp/scale-pg-table.md
            /tmp/scale-pg-plans.md
            /tmp/scale-pg.txt
          if-no-files-found: ignore
  # The accessibility checker (issue #4): axe-core in Playwright's Chromium over the main public and signed-in doors,
  # phone and desk, WCAG 2.0/2.1 A and AA; any serious or critical fault fails. The test raises its own findings as an
  # annotation; a crash before that is raised here.
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium's system libraries come through apt; the same mirror fallbacks as the other jobs, then Playwright's own.
      - run: |
          bash scripts/ci-apt.sh libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-liberation || echo "::warning::apt for Chromium did not finish; Playwright tries its own"
          npx playwright install --with-deps chromium || npx playwright install chromium
      - run: |
          set -o pipefail
          NODE_ENV=test node test/a11y.js 2>&1 | tee /tmp/a11y.txt || { grep -q '::error title=a11y' /tmp/a11y.txt || echo "::error title=a11y::$(tail -c 1500 /tmp/a11y.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1; }
      - run: NODE_ENV=test node test/wayback.js
      # An album in Wander (PR #200): the order, the acts as the rules allow, the way back, the card, a stranger refused.
      - run: NODE_ENV=test node test/albumwander.js
      # Guests add their own photographs (#203): the guest, the letter, the studio, the photographer's choice, the group, a stranger, a phone.
      - run: NODE_ENV=test node test/albumguests.js
  # The reach walk (#42): every control on every page pressable at iPad, phone and desk sizes, in both rotations.
  reach:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          bash scripts/ci-apt.sh libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-liberation || echo "::warning::apt for Chromium did not finish; Playwright tries its own"
          npx playwright install --with-deps chromium || npx playwright install chromium
      - run: |
          set -o pipefail
          NODE_ENV=test node scripts/reach-walk.js 2>&1 | tee /tmp/reach.txt || { grep -q '::error title=reach' /tmp/reach.txt || echo "::error title=reach::$(tail -c 1500 /tmp/reach.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1; }
  # The reach walk and the way back again in Safari's engine (#55): Playwright's WebKit with an iPad (gen 7), an iPad Mini
  # and an iPhone 13 (touch, the real user agent). Each walk's own annotations are muted in the log (sed) and every finding
  # is raised in full by scripts/engine-findings.js, named "webkit". A WebKit that will not install fails the job.
  reach-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WM_ENGINE: webkit
      # A gate (#55). Its first two runs were advisory (WM_WEBKIT_ADVISORY: '1', findings as warnings) because WebKit
      # cannot run on the workers' machine; their findings were fixed or allow-listed (ALLOW_WEBKIT in reach-walk.js and
      # wayback.js). To bring up a new engine or profile the same way, set that flag again for one run, never to quiet a gate.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (#109) The browser kept between runs (its install once took 24 minutes and used up the job); a stalled install is
      # stopped at ten minutes and tried once more, so the job says so instead of running out of time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - id: install
        run: timeout 600 npx playwright install --with-deps webkit || timeout 600 npx playwright install --with-deps webkit || { echo "::error title=reach-webkit::WebKit could not be installed (npx playwright install --with-deps webkit failed or stalled twice); the WebKit pass did not run"; exit 1; }
      - run: |
          rc=0
          NODE_ENV=test REACH_JSON=/tmp/reach-webkit.json node scripts/reach-walk.js > /tmp/reach-webkit.txt 2>&1 || rc=$?
          sed 's/^::/: :/' /tmp/reach-webkit.txt
          node scripts/engine-findings.js reach /tmp/reach-webkit.json /tmp/reach-webkit.txt $rc
      # Runs whether or not the reach walk found anything, once WebKit is installed.
      - if: (success() || failure()) && steps.install.outcome == 'success'
        run: |
          rc=0
          NODE_ENV=test WAYBACK_JSON=/tmp/wayback-webkit.json node test/wayback.js > /tmp/wayback-webkit.txt 2>&1 || rc=$?
          sed 's/^::/: :/' /tmp/wayback-webkit.txt
          node scripts/engine-findings.js wayback /tmp/wayback-webkit.json /tmp/wayback-webkit.txt $rc
      # The breaks walk (#149): a room throws, a limit fires, the house stops mid-visit; photographs in the artifact.
      - if: (success() || failure()) && steps.install.outcome == 'success'
        run: NODE_ENV=test BREAKS_SHOTS=/tmp/breaks-webkit node scripts/breaks-walk.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-findings
          path: |
            /tmp/*-webkit.*
            /tmp/breaks-webkit/
          if-no-files-found: ignore
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: wm
          POSTGRES_DB: wm
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:wm@localhost:5432/wm
      NODE_ENV: test
      # (#162) The restore drill does not begin unless the scratch restore is known to fit on the database server. This
      # server is a container whose disk the test cannot measure, so its room is vouched for here, as on Render.
      DRILL_MIN_FREE_MB: '8000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The client at the server's version (16), from PGDG: the runner's own is newer and its pg_restore is refused by 16.
      - run: |
          bash scripts/ci-apt.sh poppler-utils tesseract-ocr curl gnupg
          # postgresql.org drops connections now and then (5 Nov, twice in ten minutes): try, then the keyserver.
          for i in 1 2 3 4 5; do curl -fsSL --retry 3 --retry-all-errors https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc && break; sleep 8; done
          if [ ! -s /tmp/pgdg.asc ]; then gpg --keyserver keyserver.ubuntu.com --recv-keys B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 && gpg --export --armor B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 > /tmp/pgdg.asc; fi
          sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg < /tmp/pgdg.asc
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          bash scripts/ci-apt.sh postgresql-client-16
          echo "PG_BIN=/usr/lib/postgresql/16/bin" >> $GITHUB_ENV
      - run: npm ci
      # A failure's last lines go out as an annotation, readable through the API where the full log is not.
      - run: |
          set -o pipefail
          run() { "$@" 2>&1 | tee /tmp/out.txt || { echo "::error title=$1 $2::$(tail -c 1500 /tmp/out.txt | tr '\n' ' ' | tr -d '%')"; exit 1; }; }
          run node test/smoke.js test/fixture.jpg
          run node scripts/sql-check.js
          psql "$DATABASE_URL" -qc "DROP SCHEMA public CASCADE; CREATE SCHEMA public;" && run node test/instances.js # (#123) two website copies (ROLE=web), one database; after sql-check, which reads the smoke's whole house (a web-only house lacks what the chores add, e.g. works.title_given)
          for t in vault drop beta fee boot moma pricebook privatedesk pdday diskless commission nga statements numbers-shut pglimit manyhands ledgerwalk prepared onview market-rules finddb findask keptcopies albumguests backup; do psql "$DATABASE_URL" -qc "DROP SCHEMA public CASCADE; CREATE SCHEMA public;" && run node test/$t.js || exit 1; done
