# The gate between a push and the house (22 Oct): every push to main or next runs the suite; Render deploys only when
# it passes (Render → the service → Settings → "Wait for CI to pass before deploy", Will's switch). Two engines
# (27 Oct): the suite runs on SQLite as it always did, and the smoke suite and the static SQL check run against a
# real Postgres, since that is what the live house will stand on.
name: test
on:
  push:
    branches: [main, next]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The tools the Dockerfile gives the house (the document kind reads PDFs with poppler and OCRs with tesseract);
      # without them the suite stops at 'poppler on the box' and the gate stays red for nothing.
      - run: bash scripts/ci-apt.sh poppler-utils tesseract-ocr lua5.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          NODE_ENV: test
  # The load test (7 Nov, docs/STABILITY.md): forty visitors over a seeded house; p95, errors, the stand-in, memory growth.
  # The runner has two cores, so the page line is looser here than on a Mac (LOAD_P95_MS 2500).
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/load.js
        env:
          LOAD_WORKS: '24'
          LOAD_C: '20'
          LOAD_S: '25'
          LOAD_P95_MS: '2500'
          LOAD_GROW_MB: '450'   # the runner's caches fill from cold (sharp, the find index, V8); a leak shows as growth past this, not under it
  # The accessibility checker (issue #4): axe-core in Playwright's Chromium over the main public and signed-in doors,
  # phone and desk, WCAG 2.0/2.1 A and AA; any serious or critical fault fails. The test raises its own findings as an
  # annotation; a crash before that is raised here.
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium's system libraries come through apt; the same mirror fallbacks as the other jobs, then Playwright's own.
      - run: |
          bash scripts/ci-apt.sh libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-liberation || echo "::warning::apt for Chromium did not finish; Playwright tries its own"
          npx playwright install --with-deps chromium || npx playwright install chromium
      - run: |
          set -o pipefail
          NODE_ENV=test node test/a11y.js 2>&1 | tee /tmp/a11y.txt || { grep -q '::error title=a11y' /tmp/a11y.txt || echo "::error title=a11y::$(tail -c 1500 /tmp/a11y.txt | sed 's/%/%25/g' | awk 1 ORS='%0A')"; exit 1; }
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: wm
          POSTGRES_DB: wm
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:wm@localhost:5432/wm
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The client at the server's version (16), from PGDG: the runner's own is newer and its pg_restore is refused by 16.
      - run: |
          bash scripts/ci-apt.sh poppler-utils tesseract-ocr curl gnupg
          # postgresql.org drops connections now and then (5 Nov, twice in ten minutes): try, then the keyserver.
          for i in 1 2 3 4 5; do curl -fsSL --retry 3 --retry-all-errors https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc && break; sleep 8; done
          if [ ! -s /tmp/pgdg.asc ]; then gpg --keyserver keyserver.ubuntu.com --recv-keys B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 && gpg --export --armor B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 > /tmp/pgdg.asc; fi
          sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg < /tmp/pgdg.asc
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          bash scripts/ci-apt.sh postgresql-client-16
          echo "PG_BIN=/usr/lib/postgresql/16/bin" >> $GITHUB_ENV
      - run: npm ci
      # A failure's last lines go out as an annotation, readable through the API where the full log is not.
      - run: |
          set -o pipefail
          run() { "$@" 2>&1 | tee /tmp/out.txt || { echo "::error title=$1 $2::$(tail -c 1500 /tmp/out.txt | tr '\n' ' ' | tr -d '%')"; exit 1; }; }
          run node test/smoke.js test/fixture.jpg
          run node scripts/sql-check.js
          for t in vault drop beta fee boot moma pricebook privatedesk pdday diskless commission nga; do psql "$DATABASE_URL" -qc "DROP SCHEMA public CASCADE; CREATE SCHEMA public;" && run node test/$t.js || exit 1; done
