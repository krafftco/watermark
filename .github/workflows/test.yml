# The gate between a push and the house (22 Oct): every push to main runs the suite; Render deploys only when it
# passes (Render → the service → Settings → "Wait for CI to pass before deploy", Will's switch).
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          NODE_ENV: test
