  <path d="M181 148c6-10 10-16 14-18 5 6 8 12 10 18z" fill="currentColor" stroke="none"/>
  <circle cx="198" cy="123" r="3" fill="currentColor" stroke="none"/>
  <!-- a little light -->
  <path d="M214 104l6-6M216 116h7M212 96l2-8" stroke-width="1.4"/>
