  <path d="M120 140c6-4 14-4 20 0-4 4-8 5-10 4-3-1-6-2-10-4z" fill="currentColor"/>
  <!-- spectacles: round, on a ribbon -->
  <circle cx="136" cy="118" r="11" stroke-width="2.6"/>
  <path d="M125 118h-6M147 116l10-2" stroke-width="2"/>
  <path d="M136 129c-14 14-26 30-30 52" stroke-width="1.2" stroke-dasharray="2 3"/>
  <!-- collar, tie, coat -->
  <path d="M104 160c-4 14-2 24 4 30l16 6"/>
  <path d="M96 178c-20 6-38 18-46 42l-4 26h132l-8-34c-6-18-22-28-40-34"/>
  <path d="M118 194l10 10-12 6-6-10z" fill="currentColor"/>
  <path d="M106 196c6 14 10 30 12 50"/>
  <path d="M88 184l-10 62M150 186l10 60" stroke-width="1.4"/>
