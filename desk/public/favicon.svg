  <path d="M58 76c2-30 18-46 50-46s46 16 48 44" fill="currentColor"/>
  <path d="M40 80c20-6 46-9 70-9s50 3 70 9c-6 6-30 10-70 10S46 86 40 80z" fill="currentColor"/>
  <path d="M60 74c14-4 32-6 48-6s34 2 48 6" stroke="#f3eee2" stroke-width="1.6"/>
  <!-- head in profile, facing right -->
  <path d="M86 90c-8 12-10 30-4 44 4 10 12 18 22 22l10 4c10 2 18-2 24-10 4-6 6-14 4-22l-2-8c0-10-4-18-10-24-10-8-30-10-44-6z"/>
  <!-- ear -->
  <path d="M84 118c-6-2-10 2-9 8 1 5 5 8 10 7"/>
  <!-- brow, nose, lips, chin -->
  <path d="M128 104c6 2 10 4 14 8"/>
  <path d="M142 112c6 8 10 16 8 22-1 3-5 4-10 3"/>
  <path d="M134 142c6 0 10 2 12 5-2 4-6 6-12 6"/>
  <path d="M132 156c6 2 8 6 6 10-4 4-10 6-16 6"/>
