<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="The figure of the desk">
  <!-- The gentleman of the desk: in profile, a homburg, round spectacles, a photograph held up to the light. An original figure, a draft. -->
