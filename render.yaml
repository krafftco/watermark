services:
  - type: web
    name: watermark
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: watermark-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: VAULT_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SPEECH_VOICE
        value: ash
      - key: FEE_SIDE
        value: collector
      - key: COLLECT_HOUSE_CENTS
        value: "211"
      - key: HOUSE_PCT
        value: "15"
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PAYOUTS
        value: ""
      - key: MAIL_FROM
        value: Watermark <house@watermark.krafftco.com>
      - key: STUDIO_EMAILS # who may enter the Studio: email code + passkey; set it and ADMIN_PASSWORD is retired
        sync: false
      - key: BACKUP_KEEP_DAYS
        value: "30"
      - key: FIRST_COLLECTOR
        value: Amy Fullerton
      - key: PROOF_CENTS
        value: "2500"
