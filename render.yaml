services:
  - type: web
    name: watermark
    runtime: docker
    # 23 Oct: a legitimate business on 2 CPU / 4 GB (Render 'pro', $85); the disk is the SQLite file, the originals
    # cache and the renditions (the vault is S3). With the box, set in Render: NODE_OPTIONS=--max-old-space-size=2048,
    # SHARP_CONCURRENCY=2, SHARP_CACHE_MB=256, ORIGINALS_CACHE_GB=8. The workspace plan (Pro, 25 GB bandwidth) is set
    # on the workspace, not here.
    plan: pro
    healthCheckPath: /healthz
    disk:
      name: watermark-data
      mountPath: /data
      sizeGB: 25
    envVars:
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: VAULT_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SPEECH_VOICE
        value: ash
      - key: FEE_SIDE
        value: collector
      - key: COLLECT_HOUSE_CENTS
        value: "200"
      - key: HOUSE_TIERS
        value: "20:500000,15:5000000,10"
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PAYOUTS
        value: ""
      - key: MAIL_FROM
        value: Watermark <house@watermark.krafftco.com>
      - key: TRUST_PROXY # 2 behind CloudFront (25 Oct), else 1
        value: 2
      - key: CLOUDFRONT_DISTRIBUTION # the edge in front; set so a new master drops the edge's copies at once
        sync: false
      - key: STUDIO_EMAILS # who may enter the Studio: email code + passkey; set it and ADMIN_PASSWORD is retired
        sync: false
      - key: BACKUP_KEEP_DAYS
        value: "30"
      - key: FIRST_COLLECTOR
        value: Amy Fullerton
      - key: PROOF_CENTS
        value: "2500"
