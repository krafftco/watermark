services:
  - type: web
    name: watermark
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: watermark-data
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
